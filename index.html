<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador SERFISH</title>
  <meta name="theme-color" content="#d4005f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">SERFISH</span><span class="sub">Cotizador</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="quote">Cotizar</button>
      <button class="tab" data-view="settings">Precios y ajustes</button>
    </nav>
  </header>

  <main>
    <!-- ============ COTIZAR ============ -->
    <section id="view-quote" class="view">
      <div class="layout">
        <div class="panel">
          <fieldset>
            <legend>1. Datos del cliente</legend>
            <label>Nombre del cliente <input id="q-client" type="text" placeholder="Ej. María Pérez"></label>
            <div class="row">
              <label>Tipo de evento <input id="q-event" type="text" placeholder="Cumpleaños, boda…"></label>
              <label>Fecha <input id="q-date" type="date"></label>
            </div>
            <label>Lugar / dirección <input id="q-place" type="text" placeholder="Distrito o local"></label>
          </fieldset>

          <fieldset>
            <legend>2. Tamaño del lugar (para el sonido)</legend>
            <div class="row">
              <label>Tipo de espacio
                <select id="q-venue">
                  <option value="house">Casa / departamento</option>
                  <option value="hall">Salón cerrado grande</option>
                  <option value="open">Aire libre / jardín / terraza</option>
                </select>
              </label>
              <label>Invitados <input id="q-guests" type="number" min="0" inputmode="numeric" placeholder="Ej. 80"></label>
            </div>
            <div id="sound-hint" class="hint" hidden></div>
          </fieldset>

          <fieldset>
            <legend>3. Servicios</legend>
            <div id="services"></div>
          </fieldset>

          <fieldset>
            <legend>4. Movilidad y descuento</legend>
            <div class="row">
              <label>Zona
                <select id="q-transport"></select>
              </label>
              <label>Descuento (S/) <input id="q-discount" type="number" min="0" inputmode="decimal" placeholder="0"></label>
            </div>
          </fieldset>
        </div>

        <div class="preview">
          <div class="preview-actions">
            <button id="btn-download" class="btn primary">⬇ Descargar flyer (PNG)</button>
            <button id="btn-share" class="btn">📲 Compartir</button>
            <button id="btn-copy" class="btn">📋 Copiar texto</button>
          </div>
          <div id="empty" class="empty">Marca al menos un servicio para generar la cotización.</div>
          <canvas id="flyer" width="1086" height="1448"></canvas>
          <p id="toast" class="toast" hidden></p>
        </div>
      </div>
    </section>

    <!-- ============ AJUSTES ============ -->
    <section id="view-settings" class="view" hidden>
      <div id="settings-root" class="panel wide"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
